<title>Her Space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-shaped app column, centred on wider screens; a step bar on top, one screen at a time. */
:root{
  --bg:#EAF1EC; --surface:#FFFFFF; --ink:#12302A; --muted:#4E6A62; --line:#C9D9D0;
  --accent:#F2B53A; --accent-ink:#2A1E00; --leaf:#2F7D5B; --leaf-soft:#D6EBDF; --coral:#E8684A;
  --grass:#BFE0C9; --path:#F3E7CC;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1D19; --surface:#16302A; --ink:#E7F2EC; --muted:#A3BDB3; --line:#2C4A41;
  --accent:#F5C25A; --accent-ink:#231800; --leaf:#6CC79C; --leaf-soft:#1F4237; --coral:#F08A70;
  --grass:#21483B; --path:#3A4A3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1D19; --surface:#16302A; --ink:#E7F2EC; --muted:#A3BDB3; --line:#2C4A41;
  --accent:#F5C25A; --accent-ink:#231800; --leaf:#6CC79C; --leaf-soft:#1F4237; --coral:#F08A70;
  --grass:#21483B; --path:#3A4A3C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.brand{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.01em}
.brand span{color:var(--leaf)}
.pilot{border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--leaf)}
.steplabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,9vw,42px);line-height:1.02}
h2{font-size:26px;line-height:1.1}
p{margin:0}
.lead{color:var(--muted)}
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
label.fl{font-weight:700;font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.chip{font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select,textarea{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;
  padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--muted);font-size:12.5px}
.tile svg{width:26px;height:26px;color:var(--leaf)}
.tile[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:inset 0 0 0 1.5px var(--leaf)}
.feat{font:inherit;display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.feat .dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf);font-weight:800;font-size:13px}
.feat[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.feat[aria-pressed="true"] .dot{background:var(--leaf);color:var(--surface)}
.feat[disabled]{opacity:.45;cursor:not-allowed}
.feats{display:flex;flex-direction:column;gap:8px}
.tokens{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.tokens .pips{display:flex;gap:5px}
.tokens .pips i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.tokens .pips i.used{background:var(--line)}
.plan{width:100%;height:auto;border-radius:16px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.nav{display:flex;gap:10px}
.btn{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.note svg{flex:none;width:16px;height:16px;margin-top:2px}
.hero-q{color:var(--leaf)}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14.5px}
.summary dt{color:var(--muted)} .summary dd{margin:0;font-weight:500}
.sent{display:flex;flex-direction:column;gap:10px}
.next{counter-reset:n;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.next li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.next li::before{counter-increment:n;content:counter(n);flex:none;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:var(--surface);
  display:grid;place-items:center;font-size:13px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr 44px;gap:4px 10px;font-size:14px;align-items:center}
.bar .track{grid-column:1/-1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--leaf);border-radius:5px}
.bar.avoid .fill{background:var(--coral)}
.bar .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 8px;align-self:flex-start}
.footer{font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}}}
</style>

<div class="app">
  <div class="top">
    <div class="brand">Her<span>Space</span></div>
    <div class="pilot">City of Stirling pilot</div>
  </div>
  <div id="progress" hidden>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
  <main id="view" aria-live="polite"></main>
  <p class="footer">A Make Space for Her campaign by Nature Play WA. Prototype for CMM6530.</p>
</div>

<script>
const ICON = {
  friends:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5M12 20c0-3 2-5 4-5 3 0 6 2 6 5"/></svg>',
  walk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6-3-3 2-5 4 3h3M7 12l2-4"/></svg>',
  dance:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  skate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 14h18l-2 3H5z"/><circle cx="7" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/></svg>',
  sport:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  chill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18h18M5 18v-5a7 7 0 0 1 14 0v5"/><path d="M9 11h6"/></svg>',
  create:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>',
  fit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
const ACTIVITIES = [
  ['friends','Hang out with friends','Somewhere to just be'],
  ['walk','Walk and talk','Loops, not dead ends'],
  ['dance','Dance or perform','Music, TikToks, practice'],
  ['skate','Skate or scoot','Without being in the way'],
  ['sport','Casual sport','No team or try-out needed'],
  ['chill','Chill, read, listen','Quiet and comfy'],
  ['create','Get creative','Art, photos, making stuff'],
  ['fit','Work out','Without an audience']
];
// x,y = where the feature sits on the park plan (viewBox 340x230)
const FEATURES = [
  ['seats','Seats facing each other so we can talk','S',96,92],
  ['shelter','Shade and shelter from rain','Sh',150,62],
  ['lights','Good lighting after dark','L',40,48],
  ['exits','Open views and more than one way out','Ex',306,26],
  ['swings','Big swings for teens','Sw',250,92],
  ['stage','Stage or dance floor','St',204,150],
  ['court','Mixed court for free play','C',96,176],
  ['loop','Walking loop with views','W',286,186],
  ['toilets','Clean toilets close by','T',30,186],
  ['charge','Phone charging and free wifi','Ch',150,120],
  ['fitness','Outdoor gym in a quieter corner','G',300,138],
  ['art','Walls for art and murals','A',214,36],
  ['access','Smooth paths for wheelchairs and prams','P',40,120],
  ['water','Water fountain','Wa',250,190]
];
const AVOID = ['Feeling watched or judged','Boys take over the space','Too dark at night','Nowhere to sit together',
  'Nothing for my age','Hard to get to','No toilets','Feels unsafe getting there'];
const SUBURBS = ['Balcatta','Balga','Dianella','Doubleview','Innaloo','Karrinyup','Mirrabooka','Nollamara','Osborne Park',
  'Scarborough','Stirling','Trigg','Tuart Hill','Westminster','Yokine','Somewhere else'];
const TOKENS = 6;

const S = {step:0, age:null, suburb:'', acts:[], feats:[], avoid:[], other:''};
const view = document.getElementById('view');
const progress = document.getElementById('progress');
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function go(step){ S.step=step; render(); window.scrollTo({top:0}); }

function setProgress(n){
  progress.hidden = n<1 || n>4;
  progress.querySelectorAll('i').forEach((el,i)=>el.classList.toggle('on', i<n));
}

function plan(){
  const chosen = FEATURES.filter(f=>S.feats.includes(f[0]));
  return `<svg class="plan" viewBox="0 0 340 230" role="img" aria-label="Plan of your park with ${chosen.length} features">
    <rect width="340" height="230" rx="16" fill="var(--grass)"/>
    <path d="M-10 200 C 80 150, 140 210, 200 170 S 300 90, 350 110" fill="none" stroke="var(--path)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="70" cy="40" r="16" fill="var(--leaf)" opacity=".35"/><circle cx="270" cy="60" r="20" fill="var(--leaf)" opacity=".35"/>
    <circle cx="180" cy="200" r="14" fill="var(--leaf)" opacity=".35"/>
    ${chosen.length? '' : '<text x="170" y="118" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="Figtree, sans-serif">Tap features below to build your space</text>'}
    ${chosen.map(f=>`<g><circle cx="${f[3]}" cy="${f[4]}" r="17" fill="var(--ink)"/>
      <text x="${f[3]}" y="${f[4]+4.5}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--bg)" font-family="Figtree, sans-serif">${f[2]}</text></g>`).join('')}
  </svg>`;
}

const screens = {
  0(){ setProgress(0); return `<section class="screen" style="display:flex;flex-direction:column;gap:18px">
    <h1>What if the problem isn’t you? <span class="hero-q">Maybe it’s the park.</span></h1>
    <p class="lead">The City of Stirling wants to know what would make parks worth your time. Design your ideal space in about three minutes, and we’ll take it to the people who plan them.</p>
    <div class="card">
      <div style="display:flex;flex-direction:column;gap:8px"><label class="fl" id="agelbl">How old are you?</label>
        <div class="seg" role="group" aria-labelledby="agelbl">
          ${['12–13','14–15','16–17'].map(a=>`<button type="button" data-age="${a}" aria-pressed="${S.age===a}">${a}</button>`).join('')}
        </div></div>
      <div style="display:flex;flex-direction:column;gap:8px"><label class="fl" for="suburb">Which suburb are you closest to?</label>
        <select id="suburb"><option value="">Choose a suburb</option>${SUBURBS.map(s=>`<option ${S.suburb===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <p class="note">${ICON.lock}<span>Anonymous. We never ask for your name, photo or school.</span></p>
    </div>
    <div class="nav"><button class="btn primary" id="next" ${S.age&&S.suburb?'':'disabled'}>Start designing</button></div>
    <button class="btn ghost" id="results" style="flex:none">See what girls in Stirling want so far</button>
  </section>`},
  1(){ setProgress(1); return `<section class="screen" style="display:flex;flex-direction:column;gap:16px">
    <div class="steplabel">Step 1 of 4 · Choose</div>
    <h2>What would you actually do there?</h2>
    <p class="lead">Pick up to three.</p>
    <div class="grid">${ACTIVITIES.map(a=>`<button class="tile" data-act="${a[0]}" aria-pressed="${S.acts.includes(a[0])}">${ICON[a[0]]}<b>${a[1]}</b><small>${a[2]}</small></button>`).join('')}</div>
    <div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next" ${S.acts.length?'':'disabled'}>Next: build it</button></div>
  </section>`},
  2(){ setProgress(2); const left=TOKENS-S.feats.length; return `<section class="screen" style="display:flex;flex-direction:column;gap:16px">
    <div class="steplabel">Step 2 of 4 · Create</div>
    <h2>Build your space</h2>
    <p class="lead">You have ${TOKENS} build tokens. Spend them on what matters most to you.</p>
    <div class="card" style="padding:12px;gap:10px">
      ${plan()}
      <div class="tokens"><span>${left} token${left===1?'':'s'} left</span><span class="pips">${Array.from({length:TOKENS},(_,i)=>`<i class="${i<S.feats.length?'used':''}"></i>`).join('')}</span></div>
    </div>
    <div class="feats">${FEATURES.map(f=>{const on=S.feats.includes(f[0]);return `<button class="feat" data-feat="${f[0]}" aria-pressed="${on}" ${!on&&left===0?'disabled':''}><span class="dot">${f[2]}</span><span>${f[1]}</span></button>`}).join('')}</div>
    <div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next" ${S.feats.length?'':'disabled'}>Next</button></div>
  </section>`},
  3(){ setProgress(3); return `<section class="screen" style="display:flex;flex-direction:column;gap:16px">
    <div class="steplabel">Step 3 of 4 · Be honest</div>
    <h2>What makes you skip a park?</h2>
    <p class="lead">Pick as many as you like. This is the part planners most need to hear.</p>
    <div class="chips">${AVOID.map((a,i)=>`<button class="chip" data-avoid="${i}" aria-pressed="${S.avoid.includes(i)}">${a}</button>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:8px"><label class="fl" for="other">Anything else? (optional)</label>
      <textarea id="other" maxlength="280" placeholder="e.g. The only seats face the footy oval">${esc(S.other)}</textarea></div>
    <div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="next">Next: check and share</button></div>
  </section>`},
  4(){ setProgress(4);
    const acts=ACTIVITIES.filter(a=>S.acts.includes(a[0])).map(a=>a[1]).join(', ');
    const feats=FEATURES.filter(f=>S.feats.includes(f[0])).map(f=>f[1]).join('; ');
    const av=S.avoid.map(i=>AVOID[i]).join(', ')||'Nothing selected';
    return `<section class="screen" style="display:flex;flex-direction:column;gap:16px">
    <div class="steplabel">Step 4 of 4 · Share</div>
    <h2>Your space</h2>
    <div class="card summary">${plan()}
      <dl><dt>Age</dt><dd>${S.age}</dd><dt>Near</dt><dd>${esc(S.suburb)}</dd><dt>To do</dt><dd>${acts}</dd>
      <dt>Must have</dt><dd>${feats}</dd><dt>Puts me off</dt><dd>${av}</dd>${S.other?`<dt>Also</dt><dd>${esc(S.other)}</dd>`:''}</dl>
    </div>
    <div class="nav"><button class="btn ghost" id="back">Edit</button><button class="btn primary" id="send">Send to the City of Stirling</button></div>
  </section>`},
  5(){ setProgress(5); return `<section class="screen" style="display:flex;flex-direction:column;gap:16px">
    <h1>Sent. <span class="hero-q">Your voice is now evidence.</span></h1>
    <div class="card sent"><b>What happens next</b>
      <ol class="next">
        <li>Your design joins every other design from girls across Stirling.</li>
        <li>Nature Play WA turns them into a short report of what girls want and what keeps them away.</li>
        <li>The report goes to the City of Stirling parks team, and the results are posted back here.</li>
      </ol></div>
    <p class="lead">More designs make a stronger message. Send this to a friend who should have a say.</p>
    <div class="nav"><button class="btn primary" id="copy">Copy link for a friend</button></div>
    <p class="note" id="copied" hidden>Link copied.</p>
    <div class="nav"><button class="btn ghost" id="results" style="flex:1">See what girls want so far</button></div>
    <button class="btn ghost" id="restart" style="flex:none">Design another space</button>
  </section>`},
  6(){ setProgress(0);
    const want=[['Seats facing each other',71],['Good lighting after dark',64],['Shade and shelter',58],['Clean toilets close by',52],['Big swings for teens',47]];
    const off=[['Feeling watched or judged',62],['Boys take over the space',55],['Too dark at night',49],['Nowhere to sit together',41]];
    const bars=(rows,cls)=>rows.map(r=>`<div class="bar ${cls}"><span>${r[0]}</span><span class="pct">${r[1]}%</span><div class="track"><div class="fill" style="width:${r[1]}%"></div></div></div>`).join('');
    return `<section class="screen" style="display:flex;flex-direction:column;gap:16px">
    <span class="tag">Example data · prototype only</span>
    <h2>What girls in Stirling want so far</h2>
    <p class="lead">This is the summary the City of Stirling parks team would see. The numbers below are made up to show how the page works.</p>
    <div class="card"><b>Most chosen features</b><div class="bars">${bars(want,'')}</div></div>
    <div class="card"><b>What keeps girls away</b><div class="bars">${bars(off,'avoid')}</div></div>
    <div class="nav"><button class="btn primary" id="home">Add your design</button></div>
  </section>`}
};

function render(){
  view.innerHTML = screens[S.step]();
  const $ = id => document.getElementById(id);
  view.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{S.age=b.dataset.age;render();});
  if($('suburb')) $('suburb').onchange=e=>{S.suburb=e.target.value;render();};
  view.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const k=b.dataset.act;
    if(S.acts.includes(k)) S.acts=S.acts.filter(x=>x!==k); else if(S.acts.length<3) S.acts.push(k); else {S.acts.shift();S.acts.push(k);} render();});
  view.querySelectorAll('[data-feat]').forEach(b=>b.onclick=()=>{const k=b.dataset.feat;
    if(S.feats.includes(k)) S.feats=S.feats.filter(x=>x!==k); else if(S.feats.length<TOKENS) S.feats.push(k); render();});
  view.querySelectorAll('[data-avoid]').forEach(b=>b.onclick=()=>{const i=+b.dataset.avoid;
    S.avoid=S.avoid.includes(i)?S.avoid.filter(x=>x!==i):[...S.avoid,i]; render();});
  if($('other')) $('other').oninput=e=>{S.other=e.target.value;};
  if($('next')) $('next').onclick=()=>go(S.step+1);
  if($('back')) $('back').onclick=()=>go(S.step-1);
  if($('send')) $('send').onclick=()=>go(5);
  if($('results')) $('results').onclick=()=>go(6);
  if($('home')) $('home').onclick=()=>go(0);
  if($('restart')) $('restart').onclick=()=>{Object.assign(S,{acts:[],feats:[],avoid:[],other:''});go(1);};
  if($('copy')) $('copy').onclick=()=>{
    const done=()=>{$('copied').hidden=false;};
    try{ navigator.clipboard.writeText(location.href.split('#')[0]).then(done,done);}catch(e){done();}
  };
}
function fromHash(){ if(location.hash==='#results'){ S.step=6; } }
fromHash();
window.addEventListener('hashchange',()=>{ if(location.hash==='#results') go(6); });
render();
</script>
